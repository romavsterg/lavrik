services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5050:5050"
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    ports:
      - "4173:4173"
    depends_on:
      - backend

  nginx:
    profiles:
      - nginx
    build:
      context: .
      dockerfile: nginx/Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
