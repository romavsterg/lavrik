services:
  frontend:
    profiles:
      - app
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "4173:4173"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5050:5050"
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
    volumes:
      - ./backend/database.sqlite:/app/database.sqlite

  admin:
    profiles:
      - app
    build:
      context: ./admin
      dockerfile: Dockerfile
    ports:
      - "4174:4173"

  nginx:
    profiles:
      - nginx
    build:
      context: .
      dockerfile: nginx/Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
